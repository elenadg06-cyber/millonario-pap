	}

var QRMath = require('./QRMath');

function QRPolynomial(num, shift) {
	if (num.length === undefined) {
		throw new Error(num.length + "/" + shift);
	}

	var offset = 0;

	while (offset < num.length && num[offset] === 0) {
		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}
}

QRPolynomial.prototype = {

	get : function(index) {
		return this.num[index];
	},
	
	getLength : function() {
		return this.num.length;
	},
	
	multiply : function(e) {
	
		var num = new Array(this.getLength() + e.getLength() - 1);
	
		for (var i = 0; i < this.getLength(); i++) {
			for (var j = 0; j < e.getLength(); j++) {
				num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i) ) + QRMath.glog(e.get(j) ) );
			}
		}
	
		return new QRPolynomial(num, 0);
	},
	
	mod : function(e) {
	
		if (this.getLength() - e.getLength() < 0) {
			return this;
		}
	
		var ratio = QRMath.glog(this.get(0) ) - QRMath.glog(e.get(0) );
	
		var num = new Array(this.getLength() );
		
		for (var i = 0; i < this.getLength(); i++) {
			num[i] = this.get(i);
		}
		
		for (var x = 0; x < e.getLength(); x++) {
			num[x] ^= QRMath.gexp(QRMath.glog(e.get(x) ) + ratio);
		}
	
		// recursive call
		return new QRPolynomial(num, 0).mod(e);
	}
};

module.exports = QRPolynomial;

$('start').onclick=safe(async()=>{if(state.phase==='lobby'&&Object.keys(teams).length>=1)await openQuestion(0)});$('close').onclick=safe(reveal);$('next').onclick=safe(async()=>{if(state.phase!=='reveal')return;const i=Number(state.question)+1;if(i>=limit)await finish();else await openQuestion(i)});async function finish(){await update(R('state'),{phase:'finished'})}$('end').onclick=safe(async()=>{if(confirm('¿Finalizar el concurso?'))await finish()});$('full').onclick=()=>document.documentElement.requestFullscreen?.().catch(err);$('leave').onclick=()=>location.href=location.pathname;
function render(){if(!state||!room)return;const phase=state.phase, n=Object.keys(teams).length; $('status').textContent='Sala '+room+(host?' · Panel de profesora':team?' · Equipo '+team:'');$('teams').innerHTML=ids.map((i,j)=>`<div class="team" style="--c:${colors[j]}">${avatar(j)}<b>Equipo ${i}</b><span>${fmt(scores[i]?.points)} pts</span><div class="small">${!teams[i]?'Libre':phase==='question'&&host&&answers[i]!==undefined?'✓ Respondió':phase==='reveal'&&state.responses?.[i]===true?'✓ Acierto':phase==='reveal'?'—':'Conectado'}</div></div>`).join('');
$('start').disabled=working||phase!=='lobby'||n<1;$('close').disabled=working||phase!=='question';$('next').disabled=working||phase!=='reveal';$('end').disabled=working||phase==='finished';
const stage=$('stage');if(phase==='lobby'){if(host){stage.innerHTML=`<div class="lobby"><h2>Escanead el QR para entrar</h2><canvas id="qr"></canvas><div class="pin">${room}</div><p>${n} de 5 equipos inscritos</p><p class="small muted" id="url"></p></div>`;const url=new URL(location.pathname,location.origin);url.searchParams.set('pin',room);$('url').textContent=url.href;qr($('qr'),url.href)}else if(team){stage.innerHTML=`<div class="lobby">${avatar(Number(team)-1)}<h2>Equipo ${team} preparado</h2><p>Esperando a la profesora…</p></div>`}else{stage.innerHTML='<h2>Elige vuestro equipo</h2><div class="row">'+ids.map(i=>`<button data-team="${i}" ${teams[i]?'disabled':''}>Equipo ${i} ${teams[i]?'· ocupado':''}</button>`).join('')+'</div>';stage.querySelectorAll('[data-team]').forEach(b=>b.onclick=safe(()=>claim(b.dataset.team)))}return}
if(phase==='finished'){const ranking=ids.filter(i=>teams[i]).sort((a,b)=>(scores[b]?.points||0)-(scores[a]?.points||0));stage.innerHTML='<h2>🏆 Clasificación final</h2>'+ranking.map((i,j)=>`<p>${j+1}. Equipo ${i} · <b>${fmt(scores[i]?.points)} puntos</b> · ${scores[i]?.hits||0} aciertos</p>`).join('');return}
if(phase==='closing'){stage.innerHTML='<h2>Calculando resultados…</h2>';return}
const revealed=phase==='reveal', expired=now()>=state.deadline;stage.innerHTML=`<div class="row"><b>Pregunta ${Number(state.question)+1} de ${state.total}</b><span class="muted">${fmt(state.points)} puntos</span><span id="clock">${revealed?'Resultado':Math.max(0,Math.ceil((state.deadline-now())/1000))+' s'}</span></div><div class="bar"><div style="width:${(Number(state.question)+1)/state.total*100}%"></div></div><h2>${esc(state.text)}</h2><div class="answers">${(state.options||[]).map((x,i)=>`<button class="answer ${revealed?(i===state.correct?'right':'wrong'):mine===i?'chosen':''}" data-answer="${i}" ${host||revealed||expired||mine!==null||!team?'disabled':''}>${'ABCD'[i]} · ${esc(x)}</button>`).join('')}</div><p>${revealed?'✓ '+esc(state.explanation):host?Object.keys(answers).length+' de '+n+' equipos han respondido':mine!==null?'Respuesta registrada. Esperad a los demás.':'Debatid antes de responder.'}</p>`;if(!host&&!revealed)stage.querySelectorAll('[data-answer]').forEach(b=>b.onclick=safe(async()=>{if(mine!==null||now()>=state.deadline||state.phase!=='question')return;await set(R('answers/'+state.question+'/'+team),Number(b.dataset.answer));mine=Number(b.dataset.answer)}));}
setInterval(()=>{if(state?.phase==='question'){const c=$('clock');if(c)c.textContent=Math.max(0,Math.ceil((state.deadline-now())/1000))+' s';if(now()>=state.deadline){if(host&&!working&&connected)safe(reveal)();else if(!host)document.querySelectorAll('[data-answer]').forEach(b=>b.disabled=true)}}},500);
</script></body></html>
